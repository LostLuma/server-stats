mixinextras = { module = "io.github.llamalad7:mixinextras-fabric", version.ref = "mixinextras" }

osl_networking_server = { module = "net.ornithemc.osl:networking", version.ref = "osl_networking_server" }

[plugins]
mod_publish = { id = "me.modmuss50.mod-publish-plugin", version.ref = "mod_publish" }
