[versions]
gson = "2.10.1"
slf4j = "2.0.17"
annotations = "26.0.2"
fabric_loader = "0.16.14"

ploceus = "1.11.4"
fabric_loom = "1.11.2"

mixinextras = "0.5.0-rc.2"

mod_publish = "0.8.4"

osl_bundle = "0.12.1"
